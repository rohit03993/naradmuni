# Proxy public pages to the Next.js app. Keep PHP admin, images, and APIs.
# 1. In C:\xampp\apache\conf\httpd.conf enable:
#    LoadModule proxy_module modules/mod_proxy.so
#    LoadModule proxy_http_module modules/mod_proxy_http.so
# 2. Include this file, then restart Apache.
# 3. Keep `npm run dev` running in web/
#
# Existing junction: C:\xampp\htdocs\naradmuni -> public_html
# After this, http://localhost:8080/naradmuni/news/{slug} is the new UI.
# Admin remains http://localhost:8080/naradmuni/admin/
# Without this proxy, open http://localhost:3000/naradmuni/

ProxyPass /naradmuni/admin !
ProxyPass /naradmuni/images !
ProxyPass /naradmuni/team !
ProxyPass /naradmuni/ads !
ProxyPass /naradmuni/API !
ProxyPass /naradmuni/API2 !
ProxyPass /naradmuni/include !
ProxyPass /naradmuni/css !
ProxyPass /naradmuni/js !
ProxyPass /naradmuni/fonts !
ProxyPass /naradmuni/manage.php !
ProxyPass /naradmuni/userfiles !

ProxyPass /naradmuni http://127.0.0.1:3000/naradmuni
ProxyPassReverse /naradmuni http://127.0.0.1:3000/naradmuni
